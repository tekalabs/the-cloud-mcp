name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qxF "$author"; then
              echo "ok   $sha"
            else
              echo "::error::Commit $sha has no 'Signed-off-by: $author' trailer"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Sign off with 'git commit -s', or fix existing commits with 'git rebase --signoff $BASE_SHA' and force-push. See CONTRIBUTING.md."
          fi
          exit "$status"
